server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend container.
    # "api" is the service name from docker-compose — Docker's internal DNS
    # resolves it to the correct container IP automatically.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Proxy requests for uploaded book images served by the API.
    location /images/ {
        proxy_pass         http://api:8080/images/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # SPA catch-all: serve index.html for every route that isn't a real file.
    # Without this, refreshing a page like /books/5 returns a 404 from nginx
    # instead of letting React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
